name: Build Maya APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y python3-pip git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip3 install --upgrade buildozer Cython==0.29.33
        sudo apt install -y libltdl-dev
    - name: Build APK
      run: |
        yes | buildozer android debug
    - uses: actions/upload-artifact@v4
      with:
        name: maya-apk
        path: ./bin/*.apk
